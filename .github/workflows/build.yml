name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm install
      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive || true
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Accsys-APK
          path: android/app/build/outputs/apk/release/app-release.apk
